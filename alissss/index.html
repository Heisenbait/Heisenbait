<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camino de Monedas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>★ CAMINO DE MONEDAS ★</h1>
<canvas id="c" width="240" height="160"></canvas>
<div class="pad">
<button class="u" data-k="up">▲</button><button class="a" data-k="a">A</button>
<button class="l" data-k="left">◀</button><button class="d" data-k="down">▼</button><button class="r" data-k="right">▶</button>
</div>
<div class="box">Mover: flechas / WASD · Aceptar: Z, Enter o Espacio<br>Cada 20 monedas desbloqueas una canción.</div>
<div class="box" id="songs"></div>
<script src="game.js"></script>
</body>
