<h1>★ CAMINO DE MONEDAS ★</h1>
<canvas id="c" width="240" height="160"></canvas>
<div class="pad">
<button class="u" data-k="up">▲</button><button class="a" data-k="a">A</button>

<div class="box">Mover: flechas / WASD · Aceptar: Z, Enter o Espacio<br>Cada 20 monedas desbloqueas una canción.</div>
